name: indra_rmf
root: .
on_project_start: devcontainerup || devcontainer up --workspace-folder .
on_project_exit: docker stop indra_dev_container

# Factory with Open-RMF (indra/launch/factory_rmf.launch.py): Gazebo (factory_rmf.sdf), RMF core
# (schedule, blockade, door/lift supervisors, dispatcher, building_map_server, visualization),
# rmf-web api-server (:8000, from rmf-web/.venv) + dashboard (:5173), TinyRobot fleet adapter
# and one bcr_bot with Nav2 (namespace bcr_bot, not driven by RMF yet).
# Dashboard: http://localhost:5173   API: http://localhost:8000/docs   (rosbridge no se lanza: el LLM entra solo por el MCP y el api-server)
# Camera: web_video_server on http://localhost:8080 (stream?topic=/bcr_bot_N/front_camera/image_raw)
# LLM chain (host panes): indra_agv_mcp on :3001 (token minted from the container) -> GCS chat on :4000 (profile agv).
# No build here: build first with
#   colcon build --packages-up-to indra bcr_bot --symlink-install --continue-on-error

windows:
  - rmf:
      layout: tiled
      panes:
        - factory:
            - devcontainerhere
            - unset HISTFILE
            - export GZ_SIM_RESOURCE_PATH=$GZ_SIM_RESOURCE_PATH:/root/.gazebo/models
            - source /opt/ros/jazzy/setup.zsh && source /ariac_ws/install/setup.zsh
            # Each run restarts RMF's clock and forgets its tasks, but the api-server keeps /rmf_api.db: whatever was
            # underway/queued when the last run stopped is dead. Mark it killed BEFORE the api-server starts (history is kept).
            - python3 -I /ariac_ws/src/indra/scripts/close_stale_tasks.py --apply
            - ros2 launch indra factory_rmf.launch.py headless:=true paused:=false 2>&1 | tee /ariac_ws/src/lince_manager/fase3/activo/llm-chain-test/launch_$(date +%H%M%S).log
        - video:
            - devcontainerhere
            - unset HISTFILE
            - source /opt/ros/jazzy/setup.zsh && source /ariac_ws/install/setup.zsh
            # MJPEG: http://localhost:8080/stream?topic=/bcr_bot_1/front_camera/image_raw&width=640&height=480
            - ros2 run web_video_server web_video_server
        - objects:
            - devcontainerhere
            - unset HISTFILE
            - source /opt/ros/jazzy/setup.zsh && source /ariac_ws/install/setup.zsh
            # LiftObjectManager waits only 5 s for these services and goes on without them (no box ever appears):
            # wait for the spawn/delete bridge of ros_gz_sim instead of guessing a sleep (3 robots take > 25 s).
            - echo "Waiting for Gazebo and the spawn/delete bridge (/world/default/create, /remove)..."
            - until ros2 service list 2>/dev/null | grep -qx /world/default/create && ros2 service list 2>/dev/null | grep -qx /world/default/remove; do sleep 3; done
            # LiftObjectManager replaces ObjectManager.py (never both: double boxes). The object
            # appears on lift_up in a recogida_*, travels with the robot, vanishes on lift_down in an entrega_*.
            - ros2 run indra LiftObjectManager.py
        # The next two panes run on the HOST (no devcontainerhere): the container has no node.
        - mcp:
            - unset HISTFILE
            - cd indra_agv_mcp
            - source ~/.nvm/nvm.sh && nvm use
            # The api-server only accepts a JWT (HS256, dev secret of rmf-web, aud=rmf_api_server, iss=stub).
            # It has no exp/iat, so it is always the SAME string: computed here with the stdlib, no container needed.
            - export RMF_API_TOKEN=$(python3 -c 'import base64,hmac,hashlib,json;b=lambda d:base64.urlsafe_b64encode(d).rstrip(b"=");h=b(json.dumps({"alg":"HS256","typ":"JWT"},separators=(",",":")).encode());p=b(json.dumps({"aud":"rmf_api_server","iss":"stub","preferred_username":"llm"},separators=(",",":")).encode());print((h+b"."+p+b"."+b(hmac.new(b"rmfisawesome",h+b"."+p,hashlib.sha256).digest())).decode())')
            - export INDRA_DESTINATIONS_FILE=$(realpath ../indra/config/destinations.json)
            # The robot supervisor lives in the fleet_adapter inside the container (:8093, not published):
            # the host reaches the container by its IP on the indra_rmf_net bridge.
            - export SUPERVISOR_URL=http://172.25.0.10:8093
            # MCP over HTTP on :3001 (POST /mcp). RMF api-server is http://localhost:8000.
            - npm run dev:http
        - gcs:
            - unset HISTFILE
            - echo "Waiting for the MCP on :3001..."
            - until curl -s -o /dev/null localhost:3001; do sleep 2; done
            - source ~/.nvm/nvm.sh
            # GCS (chat LLM, repo alvcaballero/multiuav_gui) lives outside this workspace; override GCS_DIR if yours is elsewhere.
            - cd ${GCS_DIR:-/home/grvc/work/px4/llm_planner_gcs/multiuav_gcs}
            - nvm use
            - cd server
            # Chat: http://localhost:4000/chat (profile agv). Its .env needs MCP_ENABLE=true and MCP_CONFIG pointing at http://localhost:3001/mcp.
            # Tools that wait for a human approval (the GCS default is only the two flight tools; dotenv does not
            # override an exported variable). The AGV ones: whatever cancels or pauses an RMF task (D12, 2026-11-18).
            - export TOOL_APPROVAL_REQUIRED=load_mission_to_uav,start_mission,agv_interrupt_task,agv_cancel_task
            - npm run server
        - shell:
            - devcontainerhere
            - unset HISTFILE
            - source /opt/ros/jazzy/setup.zsh && source /ariac_ws/install/setup.zsh
            - echo "Dashboard http://localhost:5173 | API http://localhost:8000/docs | e.g. ros2 run rmf_demos_tasks dispatch_go_to_place -p pantry -st 0 --use_sim_time"
            - export GZ_SIM_RESOURCE_PATH=$GZ_SIM_RESOURCE_PATH:/ariac_ws/src/indra/worlds:/ariac_ws/src/indra/models:/ariac_ws/src/ariac_ap/ariac_gz/models:/ariac_ws/src/IFRA_ConveyorBelt/conveyorbelt_gz/models:/ariac_ws/src/bcr_bot/meshes
            - export GZ_CONFIG_PATH=/usr/share/gz:$GZ_CONFIG_PATH
            - gz launch /ariac_ws/src/indra/config/websocket.gzlaunch
