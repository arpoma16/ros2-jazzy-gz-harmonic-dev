name: indra_rmf
root: .
on_project_start: devcontainerup || devcontainer up --workspace-folder .
on_project_exit: docker stop indra_dev_container

# Factory with Open-RMF (indra/launch/factory_rmf.launch.py): Gazebo (factory_rmf.sdf), RMF core
# (schedule, blockade, door/lift supervisors, dispatcher, building_map_server, visualization),
# rmf-web api-server (:8000, from rmf-web/.venv) + dashboard (:5173), TinyRobot fleet adapter
# and one bcr_bot with Nav2 (namespace bcr_bot, not driven by RMF yet).
# Dashboard: http://localhost:5173   API: http://localhost:8000/docs   rosbridge: ws://localhost:9090
# No build here: build first with
#   colcon build --packages-up-to indra bcr_bot --symlink-install --continue-on-error

windows:
  - rmf:
      layout: tiled
      panes:
        - factory:
            - devcontainerhere
            - unset HISTFILE
            - export GZ_SIM_RESOURCE_PATH=$GZ_SIM_RESOURCE_PATH:/root/.gazebo/models
            - source /opt/ros/jazzy/setup.zsh && source /ariac_ws/install/setup.zsh
            - ros2 launch indra factory_rmf.launch.py paused:=false
        - bridge:
            - devcontainerhere
            - unset HISTFILE
            - source /opt/ros/jazzy/setup.zsh && source /ariac_ws/install/setup.zsh
            - ros2 launch rosbridge_server rosbridge_websocket_launch.xml
        - objects:
            - devcontainerhere
            - unset HISTFILE
            - echo "Waiting for Gazebo and the spawn bridge..."
            - sleep 25
            - source /opt/ros/jazzy/setup.zsh && source /ariac_ws/install/setup.zsh
            - ros2 run indra ObjectManager.py
        - shell:
            - devcontainerhere
            - unset HISTFILE
            - source /opt/ros/jazzy/setup.zsh && source /ariac_ws/install/setup.zsh
            - echo "Dashboard http://localhost:5173 | API http://localhost:8000/docs | e.g. ros2 run rmf_demos_tasks dispatch_go_to_place -p pantry -st 0 --use_sim_time"
